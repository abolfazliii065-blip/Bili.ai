          package com.example.biliai.audio

          import android.media.AudioAttributes
          import android.media.AudioFormat
          import android.media.AudioTrack
          import com.example.biliai.Emotion
          import kotlin.math.PI
          import kotlin.math.min
          import kotlin.math.sin

          /**
           * افکت صوتی هر احساس: صداها همین‌جا با کد ساخته می‌شن (بدون فایل صوتی و بدون اینترنت).
           * هر قطعه = (فرکانس شروع، فرکانس پایان، مدت به میلی‌ثانیه). فرکانس 0 یعنی سکوت.
           */
          class SoundManager {

              private data class Seg(val f0: Float, val f1: Float, val ms: Int)

              private val rate = 22050
              private val cache = mutableMapOf<Emotion, ShortArray>()

              private fun pattern(e: Emotion): List<Seg> = when (e) {
                  Emotion.NEUTRAL -> listOf(Seg(600f, 720f, 90))
                  // خنده‌مانند: چند بلیپ سریع بالا و پایین
                  Emotion.HAPPY -> listOf(
                      Seg(700f, 950f, 70), Seg(0f, 0f, 30), Seg(950f, 700f, 70), Seg(0f, 0f, 30),
                      Seg(750f, 1000f, 70), Seg(0f, 0f, 30), Seg(1000f, 750f, 90)
                  )
                  Emotion.CURIOUS -> listOf(Seg(500f, 900f, 150), Seg(0f, 0f, 70), Seg(750f, 1050f, 110))
                  Emotion.SLEEPY -> listOf(Seg(520f, 240f, 450))
                  Emotion.ANGRY -> listOf(Seg(170f, 140f, 220), Seg(0f, 0f, 50), Seg(180f, 130f, 260))
                  Emotion.PLAYFUL -> listOf(Seg(500f, 1000f, 100), Seg(1000f, 520f, 100), Seg(600f, 1100f, 120))
                  Emotion.SAD -> listOf(Seg(620f, 330f, 330), Seg(0f, 0f, 60), Seg(420f, 200f, 420))
                  Emotion.SCARED -> listOf(
                      Seg(1200f, 1400f, 50), Seg(0f, 0f, 25), Seg(1250f, 1450f, 50), Seg(0f, 0f, 25),
                      Seg(1300f, 1500f, 50), Seg(0f, 0f, 25), Seg(1350f, 1550f, 50)
                  )
                  Emotion.EXCITED -> listOf(
                      Seg(600f, 700f, 70), Seg(800f, 900f, 70), Seg(1000f, 1100f, 70), Seg(1300f, 1500f, 120)
                  )
              }

              private fun synth(segs: List<Seg>): ShortArray {
                  val total = segs.sumOf { rate * it.ms / 1000 }
                  val out = ShortArray(total)
                  var pos = 0
                  var phase = 0.0
                  for (s in segs) {
                      val n = rate * s.ms / 1000
                      for (i in 0 until n) {
                          if (s.f0 > 0f) {
                              val f = s.f0 + (s.f1 - s.f0) * i / n
                              phase += 2.0 * PI * f / rate
                              val edge = min(i, n - i).toFloat() / (n * 0.15f)
                              val env = min(1f, edge)
                              out[pos + i] = (sin(phase) * env * 0.45 * Short.MAX_VALUE).toInt().toShort()
                          }
                      }
                      pos += n
                  }
                  return out
              }

              /** صدا رو پخش می‌کنه و مدت اون (میلی‌ثانیه) رو برمی‌گردونه */
              fun play(e: Emotion): Long {
                  val pcm = cache.getOrPut(e) { synth(pattern(e)) }
                  val durationMs = pcm.size * 1000L / rate
                  Thread {
                      try {
                          val track = AudioTrack.Builder()
                              .setAudioAttributes(
                                  AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_MEDIA)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                      .build()
                              )
                              .setAudioFormat(
                                  AudioFormat.Builder()
                                      .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                      .setSampleRate(rate)
                                      .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                      .build()
                              )
                              .setBufferSizeInBytes(pcm.size * 2)
                              .setTransferMode(AudioTrack.MODE_STATIC)
                              .build()
                          track.write(pcm, 0, pcm.size)
                          track.play()
                          Thread.sleep(durationMs + 120)
                          track.release()
                      } catch (ignored: Exception) {
                      }
                  }.start()
                  return durationMs
              }

              fun release() {}
          }
