      - name: Download Persian Vosk model (bundled into the APK, runs offline)
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-fa-0.42.zip
          unzip -q model.zip
          mv vosk-model-small-fa-0.42 app/src/main/assets/model-fa
          rm -rf app/src/main/assets/model-fa/test model.zip
          ls app/src/main/assets/model-fa

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Bili.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Bili-APK
          path: Bili.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bili-build-${{ github.run_number }}
          name: Bili APK (build ${{ github.run_number }})
          files: Bili.apk

