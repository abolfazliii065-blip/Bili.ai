          package com.example.biliai

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import com.example.biliai.audio.SoundManager
          import com.example.biliai.brain.Brain
          import com.example.biliai.brain.Reply
          import com.example.biliai.voice.VoiceEngine
          import com.example.biliai.voice.VoiceListener

          /** هماهنگ‌کننده‌ی بین گوش (STT)، مغز، چشم‌ها، صدا و دهان (TTS) */
          class BiliController(ctx: Context) : VoiceListener {

              var emotion by mutableStateOf(Emotion.NEUTRAL)
                  private set
              var awake by mutableStateOf(false)
                  private set
              var caption by mutableStateOf("")
                  private set
              var status by mutableStateOf("در حال آماده‌سازی…")

              private val main = Handler(Looper.getMainLooper())
              private val brain = Brain(ctx)
              private val sounds = SoundManager()
              private val voice = VoiceEngine(ctx, this)

              fun start() = voice.init()

              fun setActive(active: Boolean) = voice.setActive(active)

              fun tapToTalk() {
                  if (!voice.isReady || voice.isBusy) return
                  wakeUp()
                  voice.listenCommand()
              }

              fun release() {
                  main.removeCallbacksAndMessages(null)
                  voice.release()
                  sounds.release()
              }

              private fun wakeUp() {
                  if (!awake) {
                      awake = true
                      emotion = Emotion.CURIOUS
                      sounds.play(Emotion.CURIOUS)
                  }
                  caption = ""
              }

              private fun goSleep() {
                  awake = false
                  emotion = Emotion.NEUTRAL
                  caption = ""
                  voice.listenWake()
              }

              // ---------- VoiceListener ----------

              override fun onReady() {
                  status = "بگو «بیلی» یا صفحه رو لمس کن"
              }

              override fun onWake() = wakeUp()

              override fun onHeard(text: String) {
                  val reply: Reply = brain.respond(text)
                  emotion = reply.emotion
                  val delayMs = sounds.play(reply.emotion)
                  main.postDelayed({
                      caption = reply.text
                      voice.speak(reply.text) {
                          if (reply.sleep) goSleep() else voice.listenCommand(6000)
                      }
                  }, delayMs + 80)
              }

              override fun onListeningTimeout() = goSleep()

              override fun onTtsMissing() {
                  status = "صدای فارسی آفلاین روی گوشی نصب نیست (راهنما: SETUP.md)"
              }

              override fun onError(message: String) {
                  status = message
              }
          }
