          package com.example.biliai.ui

          import androidx.compose.animation.animateColorAsState
          import androidx.compose.animation.core.Animatable
          import androidx.compose.animation.core.FastOutSlowInEasing
          import androidx.compose.animation.core.LinearEasing
          import androidx.compose.animation.core.RepeatMode
          import androidx.compose.animation.core.animateFloat
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.animation.core.infiniteRepeatable
          import androidx.compose.animation.core.rememberInfiniteTransition
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.remember
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.CornerRadius
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.RoundRect
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.drawscope.clipPath
          import com.example.biliai.Emotion
          import kotlinx.coroutines.delay
          import kotlin.random.Random

          /** پارامترهای شکل چشم برای هر احساس */
          private data class Shape(
              val open: Float = 1f,        // باز بودن عمودی
              val w: Float = 1f,           // ضریب عرض
              val h: Float = 1f,           // ضریب ارتفاع
              val angry: Float = 0f,       // پلک اخمو
              val sad: Float = 0f,         // پلک غمگین
              val cheek: Float = 0f,       // لبه‌ی خندان پایین چشم
              val rightOpen: Float = 1f,   // چشم راست (برای چشمک)
              val rightScale: Float = 1f,  // بزرگ‌تر بودن چشم راست (کنجکاوی)
              val lookY: Float = 0f,
              val shake: Float = 0f,
              val bounce: Float = 0f,
          )

          private fun shapeFor(e: Emotion): Shape = when (e) {
              Emotion.NEUTRAL -> Shape()
              Emotion.HAPPY -> Shape(cheek = 0.55f, h = 0.9f)
              Emotion.CURIOUS -> Shape(rightScale = 1.25f, lookY = -0.2f, h = 1.05f)
              Emotion.SLEEPY -> Shape(open = 0.3f)
              Emotion.ANGRY -> Shape(angry = 0.55f, h = 0.85f)
              Emotion.PLAYFUL -> Shape(rightOpen = 0.12f, cheek = 0.3f)
              Emotion.SAD -> Shape(sad = 0.55f, open = 0.85f, lookY = 0.2f)
              Emotion.SCARED -> Shape(w = 0.7f, h = 1.25f, shake = 1f)
              Emotion.EXCITED -> Shape(w = 1.15f, h = 1.15f, cheek = 0.25f, bounce = 1f)
          }

          private fun colorFor(e: Emotion): Color = when (e) {
              Emotion.ANGRY -> Color(0xFFFF5252)
              Emotion.SAD -> Color(0xFF7FB2FF)
              Emotion.HAPPY -> Color(0xFF5CFFB0)
              Emotion.EXCITED -> Color(0xFFFFE066)
              Emotion.PLAYFUL -> Color(0xFFFF8CF0)
              else -> Color(0xFF4DE8FF)
          }

          @Composable
          private fun anim(v: Float): Float = animateFloatAsState(v, tween(380), label = "p").value

          @Composable
          fun BiliEyes(emotion: Emotion, awake: Boolean, modifier: Modifier = Modifier) {
              val s = shapeFor(emotion)
              val open = anim(s.open)
              val w = anim(s.w)
              val h = anim(s.h)
              val angry = anim(s.angry)
              val sad = anim(s.sad)
              val cheek = anim(s.cheek)
              val rOpen = anim(s.rightOpen)
              val rScale = anim(s.rightScale)
              val lookY = anim(s.lookY)
              val shake = anim(s.shake)
              val bounce = anim(s.bounce)
              val wake by animateFloatAsState(if (awake) 1f else 0f, tween(550), label = "wake")
              val color by animateColorAsState(colorFor(emotion), tween(380), label = "color")

              val blink = remember { Animatable(1f) }
              val lookX = remember { Animatable(0f) }

              LaunchedEffect(Unit) {
                  while (true) {
                      delay(Random.nextLong(2200, 5200))
                      blink.animateTo(0.05f, tween(80))
                      blink.animateTo(1f, tween(110))
                  }
              }
              LaunchedEffect(Unit) {
                  while (true) {
                      delay(Random.nextLong(1500, 3800))
                      lookX.animateTo(Random.nextFloat() * 0.36f - 0.18f, tween(300))
                  }
              }

              val inf = rememberInfiniteTransition(label = "inf")
              val wob by inf.animateFloat(
                  -1f, 1f,
                  infiniteRepeatable(tween(90, easing = LinearEasing), RepeatMode.Reverse),
                  label = "wob"
              )
              val bob by inf.animateFloat(
                  0f, 1f,
                  infiniteRepeatable(tween(260, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "bob"
              )

              Canvas(modifier.fillMaxSize()) {
                  val cw = size.width
                  val ch = size.height
                  val baseW = cw * 0.22f
                  val baseH = ch * 0.5f
                  val gap = cw * 0.12f
                  val cyBase = ch * 0.5f - bounce * bob * ch * 0.04f
                  val a = 0.3f + 0.7f * wake
                  // وقتی بیدار نیست چشم‌ها یه خط باریک و کم‌نورن؛ با بیدار شدن، باز می‌شن
                  val openNow = (0.05f + (open - 0.05f) * wake) * blink.value

                  for (side in 0..1) {
                      val isRight = side == 1
                      val sc = if (isRight) rScale else 1f
                      val ow = baseW * w * sc
                      val oh = (baseH * h * sc * openNow * (if (isRight) rOpen else 1f)).coerceAtLeast(6f)
                      val dir = if (isRight) 1f else -1f
                      val cx = cw / 2f + dir * (gap / 2f + baseW / 2f) + shake * wob * cw * 0.006f + lookX.value * baseW
                      val cy = cyBase + lookY * baseH * 0.25f
                      val left = cx - ow / 2f
                      val top = cy - oh / 2f
                      val radius = CornerRadius(minOf(ow, oh) * 0.35f)

                      // درخشش ملایم دور چشم
                      drawRoundRect(
                          color.copy(alpha = 0.10f * a),
                          topLeft = Offset(left - ow * 0.06f, top - oh * 0.04f),
                          size = Size(ow * 1.12f, oh * 1.08f),
                          cornerRadius = radius
                      )

                      val eye = Path().apply { addRoundRect(RoundRect(left, top, left + ow, top + oh, radius)) }
                      drawPath(eye, color.copy(alpha = a))

                      clipPath(eye) {
                          val outerX = if (isRight) left + ow else left
                          val innerX = if (isRight) left else left + ow
                          if (angry > 0.01f) {
                              val lid = Path().apply {
                                  moveTo(outerX, top - 2f); lineTo(innerX, top - 2f)
                                  lineTo(innerX, top + angry * oh); close()
                              }
                              drawPath(lid, Color.Black)
                          }
                          if (sad > 0.01f) {
                              val lid = Path().apply {
                                  moveTo(innerX, top - 2f); lineTo(outerX, top - 2f)
                                  lineTo(outerX, top + sad * oh); close()
                              }
                              drawPath(lid, Color.Black)
                          }
                          if (cheek > 0.01f) {
                              drawOval(
                                  Color.Black,
                                  topLeft = Offset(left - ow * 0.15f, top + oh * (1f - cheek)),
                                  size = Size(ow * 1.3f, oh * cheek * 1.8f)
                              )
                          }
                      }
                  }
              }
          }
