          package com.example.biliai.brain

          object PersianText {

              fun normalize(s: String): String {
                  val sb = StringBuilder()
                  for (c in s.lowercase()) {
                      when {
                          c == 'ي' || c == 'ى' -> sb.append('ی')
                          c == 'ك' -> sb.append('ک')
                          c == 'ۀ' || c == 'ة' -> sb.append('ه')
                          c == 'أ' || c == 'إ' || c == 'ٱ' -> sb.append('ا')
                          c == '\u200c' || c == '\u200f' || c == '\u200e' -> sb.append(' ')
                          c in '۰'..'۹' -> sb.append('0' + (c - '۰'))
                          c in '٠'..'٩' -> sb.append('0' + (c - '٠'))
                          c in "،؟!.,?:؛\"'«»()-" -> sb.append(' ')
                          c in '\u064B'..'\u065F' || c == '\u0640' -> { /* حرکات و کشیده: حذف */ }
                          else -> sb.append(c)
                      }
                  }
                  return sb.toString().trim().replace(Regex("\\s+"), " ")
              }

              private val WAKE = setOf("بیلی", "ویلی", "بیلیی")

              /** برمی‌گردونه: آیا کلمه‌ی بیدارباش بود؟ + بقیه‌ی جمله بدون اون */
              fun stripWake(norm: String): Pair<Boolean, String> {
                  val tokens = norm.split(" ").filter { it.isNotEmpty() }
                  var found = false
                  val out = mutableListOf<String>()
                  var i = 0
                  while (i < tokens.size) {
                      if (tokens[i] in WAKE) {
                          found = true; i++
                      } else if (i + 1 < tokens.size && (tokens[i] + tokens[i + 1]) in WAKE) {
                          found = true; i += 2
                      } else {
                          out.add(tokens[i]); i++
                      }
                  }
                  return found to out.joinToString(" ")
              }
          }
