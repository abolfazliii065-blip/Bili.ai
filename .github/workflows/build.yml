          cat > app/src/main/java/com/example/biliai/voice/VoiceEngine.kt <<'BILI_EOF_7Q'
          package com.example.biliai.voice

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import com.example.biliai.brain.PersianText
          import org.json.JSONObject
          import org.vosk.Model
          import org.vosk.Recognizer
          import org.vosk.android.RecognitionListener
          import org.vosk.android.SpeechService
          import java.io.File
          import java.io.FileNotFoundException
          import java.io.FileOutputStream
          import java.util.Locale

          interface VoiceListener {
              fun onReady()
              fun onWake()
              fun onHeard(text: String)
              fun onListeningTimeout()
              fun onTtsMissing()
              fun onError(message: String)
          }

          /**
           * تشخیص گفتار آفلاین فارسی با Vosk + کلمه‌ی بیدارباش «بیلی» + صحبت کردن با TTS آفلاین.
           * هیچ درخواست اینترنتی در کار نیست.
           */
          class VoiceEngine(private val ctx: Context, private val listener: VoiceListener) : RecognitionListener {

              private enum class Mode { WAKE, COMMAND, BUSY }

              private val main = Handler(Looper.getMainLooper())
              private var mode = Mode.WAKE
              private var model: Model? = null
              private var service: SpeechService? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var onSpeakDone: (() -> Unit)? = null
              private var active = true

              val isReady: Boolean get() = service != null
              val isBusy: Boolean get() = mode == Mode.BUSY

              private val commandTimeout = Runnable {
                  if (mode == Mode.COMMAND) {
                      mode = Mode.WAKE
                      listener.onListeningTimeout()
                  }
              }

              // ---------- راه‌اندازی ----------

              fun init() {
                  initTts()
                  Thread {
                      try {
                          val dir = File(ctx.filesDir, "model-fa")
                          val marker = File(dir, ".copied")
                          if (!marker.exists()) {
                              if ((ctx.assets.list("model-fa") ?: emptyArray()).isEmpty()) {
                                  throw IllegalStateException("پوشه‌ی model-fa داخل assets پیدا نشد")
                              }
                              dir.deleteRecursively()
                              copyAssets("model-fa", dir)
                              marker.writeText("ok")
                          }
                          val m = Model(dir.absolutePath)
                          val svc = SpeechService(Recognizer(m, 16000.0f), 16000.0f)
                          main.post {
                              model = m
                              service = svc
                              svc.startListening(this)
                              listener.onReady()
                          }
                      } catch (e: Throwable) {
                          main.post { listener.onError("خطا در بارگذاری مدل صوتی: ${e.message}") }
                      }
                  }.start()
              }

              private fun copyAssets(path: String, dest: File) {
                  val children = ctx.assets.list(path) ?: emptyArray()
                  if (children.isEmpty()) {
                      try {
                          dest.parentFile?.mkdirs()
                          ctx.assets.open(path).use { input ->
                              FileOutputStream(dest).use { output -> input.copyTo(output) }
                          }
                      } catch (ignored: FileNotFoundException) {
                          dest.mkdirs()
                      }
                  } else {
                      dest.mkdirs()
                      for (c in children) copyAssets("$path/$c", File(dest, c))
                  }
              }

              private fun initTts() {
                  tts = TextToSpeech(ctx) { status ->
                      val t = tts
                      if (status != TextToSpeech.SUCCESS || t == null) {
                          main.post { listener.onTtsMissing() }
                          return@TextToSpeech
                      }
                      val langResult = t.setLanguage(Locale("fa", "IR"))
                      // فقط صدای آفلاین قبول می‌کنیم
                      val offlineVoice = try {
                          t.voices?.firstOrNull { it.locale.language == "fa" && !it.isNetworkConnectionRequired }
                      } catch (e: Exception) {
                          null
                      }
                      if (langResult < 0 || offlineVoice == null) {
                          main.post { listener.onTtsMissing() }
                          return@TextToSpeech
                      }
                      t.voice = offlineVoice
                      t.setPitch(1.2f)
                      t.setSpeechRate(1.0f)
                      t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                          override fun onStart(utteranceId: String?) {}
                          override fun onDone(utteranceId: String?) { main.post { finishSpeak() } }
                          @Deprecated("Deprecated in Java")
                          override fun onError(utteranceId: String?) { main.post { finishSpeak() } }
                      })
                      ttsReady = true
                  }
              }

              // ---------- شنیدن ----------

              override fun onPartialResult(hypothesis: String?) {
                  if (mode != Mode.WAKE || hypothesis == null) return
                  val text = PersianText.normalize(JSONObject(hypothesis).optString("partial"))
                  if (text.isNotEmpty() && PersianText.stripWake(text).first) enterCommandMode()
              }

              override fun onResult(hypothesis: String?) {
                  if (hypothesis == null) return
                  handleText(PersianText.normalize(JSONObject(hypothesis).optString("text")))
              }

              override fun onFinalResult(hypothesis: String?) {
                  onResult(hypothesis)
              }

              override fun onError(exception: Exception?) {
                  main.post { listener.onError("خطای میکروفون: ${exception?.message}") }
              }

              override fun onTimeout() {}

              private fun handleText(text: String) {
                  if (text.isEmpty()) return
                  when (mode) {
                      Mode.BUSY -> {}
                      Mode.WAKE -> {
                          val (found, rest) = PersianText.stripWake(text)
                          if (!found) return
                          enterCommandMode()
                          if (rest.isNotEmpty()) deliver(rest)
                      }
                      Mode.COMMAND -> {
                          val rest = PersianText.stripWake(text).second
                          if (rest.isNotEmpty()) deliver(rest)
                      }
                  }
              }

              private fun enterCommandMode() {
                  mode = Mode.COMMAND
                  main.removeCallbacks(commandTimeout)
                  main.postDelayed(commandTimeout, 8000)
                  listener.onWake()
              }

              private fun deliver(text: String) {
                  main.removeCallbacks(commandTimeout)
                  mode = Mode.BUSY
                  listener.onHeard(text)
              }

              // ---------- کنترل از بیرون ----------

              /** گوش بده برای دستور (مثلا بعد از لمس صفحه یا بعد از جواب بیلی) */
              fun listenCommand(timeoutMs: Long = 7000) {
                  mode = Mode.COMMAND
                  resumeMic()
                  main.removeCallbacks(commandTimeout)
                  main.postDelayed(commandTimeout, timeoutMs)
              }

              fun listenWake() {
                  main.removeCallbacks(commandTimeout)
                  mode = Mode.WAKE
                  resumeMic()
              }

              private fun resumeMic() {
                  service?.reset()
                  if (active) service?.setPause(false)
              }

              fun setActive(a: Boolean) {
                  active = a
                  if (!a) service?.setPause(true)
                  else if (mode != Mode.BUSY) service?.setPause(false)
              }

              fun speak(text: String, onDone: () -> Unit) {
                  val t = tts
                  if (!ttsReady || t == null) {
                      main.post(onDone)
                      return
                  }
                  onSpeakDone = onDone
                  service?.setPause(true) // تا بیلی صدای خودش رو نشنوه
                  t.speak(text, TextToSpeech.QUEUE_FLUSH, null, "bili")
              }

              private fun finishSpeak() {
                  val cb = onSpeakDone
                  onSpeakDone = null
                  cb?.invoke()
              }

              fun release() {
                  main.removeCallbacksAndMessages(null)
                  try { service?.stop() } catch (ignored: Exception) {}
                  try { service?.shutdown() } catch (ignored: Exception) {}
                  try { model?.close() } catch (ignored: Exception) {}
                  try { tts?.stop(); tts?.shutdown() } catch (ignored: Exception) {}
              }
          }
