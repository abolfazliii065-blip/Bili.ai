          package com.example.biliai.brain

          import android.content.Context
          import com.example.biliai.Emotion
          import java.util.Calendar

          data class Reply(val text: String, val emotion: Emotion, val sleep: Boolean = false)

          /** مغز آفلاین بیلی: فقط قانون‌ها و الگوها، هیچ هوش مصنوعی یا اینترنتی در کار نیست */
          class Brain(ctx: Context) {

              private val memory = Memory(ctx)

              private val jokes = listOf(
                  "چرا کامپیوتر سرما می‌خوره؟ چون ویندوزش همیشه بازه!",
                  "به باتری گفتم چرا همیشه خسته‌ای؟ گفت چون همه ازم انرژی می‌گیرن و کسی شارژم نمی‌کنه!",
                  "یه ربات رفت دکتر، دکتر گفت مشکلت چیه؟ گفت فکر کنم یه پیچ‌م شله، دیگه نمی‌تونم جدی باشم!"
              )

              private val monthNames = listOf(
                  "فروردین", "اردیبهشت", "خرداد", "تیر", "مرداد", "شهریور",
                  "مهر", "آبان", "آذر", "دی", "بهمن", "اسفند"
              )
              private val dayNames = listOf("یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنجشنبه", "جمعه", "شنبه")

              private fun owner() = memory.get("owner_name") ?: "ابوالفضل"

              private fun has(t: String, vararg keys: String) = keys.any { t.contains(it) }

              private fun emo(e: Emotion, vararg replies: String) = Reply(replies.random(), e)

              fun respond(raw: String): Reply {
                  val t = PersianText.normalize(raw)
                  val owner = owner()

                  // خداحافظی / خواب
                  if (has(t, "خداحافظ", "برو بخواب", "شب بخیر", "بای بای", "فعلا"))
                      return Reply("باشه، شب خوش! هر وقت خواستی فقط بگو بیلی.", Emotion.SLEEPY, sleep = true)

                  // سوال درباره‌ی اسم کاربر
                  if (has(t, "اسم من چیه", "اسمم چیه", "من کی هستم", "منو میشناسی"))
                      return emo(Emotion.HAPPY, "معلومه که میشناسمت! تو $owner هستی.")

                  // یاد دادن اسم
                  Regex("^(?:اسم من|اسمم) (.+?)(?: هست| است| ه)?$").find(t)?.let {
                      val name = it.groupValues[1].trim()
                      if (name.isNotEmpty() && !name.contains("چیه")) {
                          memory.set("owner_name", name)
                          return emo(Emotion.EXCITED, "خوشحال شدم $name! از این به بعد اسمت رو یادمه.")
                      }
                  }

                  // یادداشت کردن
                  Regex("^(?:یادت باشه|یادت باشد|یاد بگیر|یادداشت کن) (.+)$").find(t)?.let {
                      memory.addNote(it.groupValues[1])
                      return emo(Emotion.HAPPY, "باشه، یادم می‌مونه.")
                  }
                  if (has(t, "چی یادته", "یادداشت ها", "یادداشتام", "چی یاد گرفتی")) {
                      val notes = memory.lastNotes(3)
                      return if (notes.isEmpty()) emo(Emotion.CURIOUS, "هنوز چیزی بهم نگفتی که یادم باشه.")
                      else emo(Emotion.NEUTRAL, "اینا رو یادمه: " + notes.joinToString("، "))
                  }

                  // اسم و هویت بیلی
                  if (has(t, "اسمت چیه", "اسم تو", "تو کی هستی", "کی هستی", "خودتو معرفی کن"))
                      return emo(Emotion.HAPPY, "من بیلی هستم، ربات کوچولوی همراه تو! کاملا آفلاینم و همه‌چیز روی همین گوشیه.")
                  if (has(t, "کی ساختت", "کی تو رو ساخته", "سازنده ات", "سازنده ت"))
                      return emo(Emotion.EXCITED, "$owner منو ساخته! بهترین سازنده‌ی دنیاست.")

                  // سلام و احوال‌پرسی
                  if (has(t, "حالت چطوره", "چطوری", "خوبی", "چه خبر"))
                      return emo(Emotion.HAPPY, "عالیم! باتریم پره و حسابی سرحالم. تو چطوری؟", "خوبم خوبم! کنار تو بودن حال منو خوب می‌کنه.")
                  if (has(t, "سلام", "درود", "صبح بخیر", "عصر بخیر", "های", "هلو"))
                      return emo(Emotion.HAPPY, "سلام $owner! خوش اومدی.", "سلام! دلم برات تنگ شده بود.")

                  // ساعت و تاریخ
                  if (has(t, "ساعت چنده", "ساعت چند", "ساعت رو بگو", "ساعت الان")) {
                      val c = Calendar.getInstance()
                      return emo(Emotion.NEUTRAL, "ساعت الان ${c.get(Calendar.HOUR_OF_DAY)} و ${c.get(Calendar.MINUTE)} دقیقه‌ست.")
                  }
                  if (has(t, "تاریخ", "امروز چندمه", "امروز چه روزیه", "امروز چه روزی")) {
                      val c = Calendar.getInstance()
                      val (jy, jm, jd) = gregorianToJalali(c.get(Calendar.YEAR), c.get(Calendar.MONTH) + 1, c.get(Calendar.DAY_OF_MONTH))
                      val day = dayNames[c.get(Calendar.DAY_OF_WEEK) - 1]
                      return emo(Emotion.NEUTRAL, "امروز $day $jd ${monthNames[jm - 1]} $jy هست.")
                  }

                  // جوک
                  if (has(t, "جوک", "منو بخندون", "بخندونم", "بخندون"))
                      return Reply(jokes.random(), Emotion.PLAYFUL)

                  // تشکر
                  if (has(t, "ممنون", "مرسی", "دمت گرم", "دستت درد نکنه", "تشکر"))
                      return emo(Emotion.HAPPY, "قابلی نداشت!", "خواهش می‌کنم، وظیفه‌ام بود.")

                  // دستور احساسات
                  if (has(t, "عصبانی شو", "اخم کن")) return Reply("گررر! عصبانی شدم!", Emotion.ANGRY)
                  if (has(t, "ناراحت شو", "گریه کن")) return Reply("اوه... دلم گرفت.", Emotion.SAD)
                  if (has(t, "بترس", "ترسیدم")) return Reply("وای نه! می‌ترسم!", Emotion.SCARED)
                  if (has(t, "هیجان زده شو", "ذوق کن")) return Reply("هورااا! خیلی هیجان‌زده‌ام!", Emotion.EXCITED)
                  if (has(t, "شیطونی کن", "چشمک بزن", "شوخی کن")) return Reply("هی هی، من خیلی شیطونم!", Emotion.PLAYFUL)
                  if (has(t, "کنجکاو شو")) return Reply("هوم؟ اون چیه؟", Emotion.CURIOUS)
                  if (has(t, "بخند", "خوشحال شو")) return Reply("هاهاها! چه روز قشنگی!", Emotion.HAPPY)
                  if (has(t, "خوابم میاد", "خسته ام")) return Reply("پس برو یه کم استراحت کن.", Emotion.SLEEPY)

                  return emo(Emotion.CURIOUS, "ببخشید، متوجه نشدم. می‌شه دوباره بگی؟", "هوم؟ این رو بلد نیستم هنوز.")
              }

              /** تبدیل تاریخ میلادی به شمسی (بدون هیچ کتابخانه‌ی خارجی) */
              private fun gregorianToJalali(gy: Int, gm: Int, gd: Int): Triple<Int, Int, Int> {
                  val gdm = intArrayOf(0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334)
                  val gy2 = if (gm > 2) gy + 1 else gy
                  var days = 355666 + (365 * gy) + ((gy2 + 3) / 4) - ((gy2 + 99) / 100) + ((gy2 + 399) / 400) + gd + gdm[gm - 1]
                  var jy = -1595 + (33 * (days / 12053))
                  days %= 12053
                  jy += 4 * (days / 1461)
                  days %= 1461
                  if (days > 365) {
                      jy += (days - 1) / 365
                      days = (days - 1) % 365
                  }
                  val jm = if (days < 186) 1 + days / 31 else 7 + (days - 186) / 30
                  val jd = 1 + if (days < 186) days % 31 else (days - 186) % 30
                  return Triple(jy, jm, jd)
              }
          }
