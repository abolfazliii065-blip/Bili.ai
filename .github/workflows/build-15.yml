          package com.example.biliai.music

          import android.Manifest
          import android.content.ContentUris
          import android.content.Context
          import android.content.pm.PackageManager
          import android.media.AudioAttributes
          import android.media.AudioFocusRequest
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.provider.MediaStore
          import androidx.core.content.ContextCompat

          data class Song(val id: Long, val title: String, val artist: String)

          /**
           * پخش‌کننده‌ی آهنگ‌های خود گوشی (کاملاً آفلاین، بدون اینترنت).
           * همه‌ی تابع‌های فرمان اگه مشکلی باشه یک متن فارسی (توضیح خطا) برمی‌گردونن، و اگه همه‌چیز خوب بود null.
           */
          class MusicPlayer(private val ctx: Context) {

              companion object {
                  fun permissionName(): String =
                      if (Build.VERSION.SDK_INT >= 33) Manifest.permission.READ_MEDIA_AUDIO
                      else Manifest.permission.READ_EXTERNAL_STORAGE

                  private const val NO_PERMISSION =
                      "اجازه‌ی دسترسی به آهنگ‌ها رو ندارم. از تنظیمات برنامه بهم بده."
                  private const val NO_SONGS = "هیچ آهنگی توی گوشی پیدا نکردم."
                  private const val NOTHING_PLAYING = "الان آهنگی پخش نمی‌شه."
                  private const val KEY_FAV_ID = "fav_song_id"
                  private const val KEY_FAV_TITLE = "fav_song_title"
              }

              private val prefs = ctx.getSharedPreferences("bili", Context.MODE_PRIVATE)
              private val audioManager = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager

              private var player: MediaPlayer? = null
              private var queue: List<Song> = emptyList()
              private var index = 0
              private var ducked = false
              private var paused = false
              private var resumeOnGain = false
              private var failCount = 0
              private var focusRequest: AudioFocusRequest? = null

              private val attrs: AudioAttributes = AudioAttributes.Builder()
                  .setUsage(AudioAttributes.USAGE_MEDIA)
                  .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                  .build()

              // ---------- مجوز و فهرست آهنگ‌ها ----------

              fun hasPermission(): Boolean =
                  ContextCompat.checkSelfPermission(ctx, permissionName()) == PackageManager.PERMISSION_GRANTED

              fun loadSongs(): List<Song> {
                  if (!hasPermission()) return emptyList()
                  val list = mutableListOf<Song>()
                  try {
                      val projection = arrayOf(
                          MediaStore.Audio.Media._ID,
                          MediaStore.Audio.Media.TITLE,
                          MediaStore.Audio.Media.ARTIST
                      )
                      val selection =
                          "${MediaStore.Audio.Media.IS_MUSIC} != 0 AND ${MediaStore.Audio.Media.DURATION} >= 30000"
                      val cursor = ctx.contentResolver.query(
                          MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                          projection,
                          selection,
                          null,
                          MediaStore.Audio.Media.TITLE + " COLLATE NOCASE ASC"
                      )
                      cursor?.use { c ->
                          val idCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val titleCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE)
                          val artistCol = c.getColumnIndexOrThrow(MediaStore.Audio.Media.ARTIST)
                          while (c.moveToNext()) {
                              val artist = c.getString(artistCol) ?: ""
                              list.add(
                                  Song(
                                      c.getLong(idCol),
                                      c.getString(titleCol) ?: "بدون نام",
                                      if (artist == "<unknown>") "" else artist
                                  )
                              )
                          }
                      }
                  } catch (e: Exception) {
                  }
                  return list
              }

              // ---------- آهنگ مورد علاقه ----------

              fun favoriteId(): Long = prefs.getLong(KEY_FAV_ID, -1L)

              fun favoriteTitle(): String? = prefs.getString(KEY_FAV_TITLE, null)

              fun setFavorite(song: Song?) {
                  val e = prefs.edit()
                  if (song == null) {
                      e.remove(KEY_FAV_ID)
                      e.remove(KEY_FAV_TITLE)
                  } else {
                      e.putLong(KEY_FAV_ID, song.id)
                      e.putString(KEY_FAV_TITLE, song.title)
                  }
                  e.apply()
              }

              // ---------- فرمان‌ها ----------

              /** پخش: اگه آهنگی مکث شده ادامه می‌ده، وگرنه از بین آهنگ‌ها یکی رو تصادفی شروع می‌کنه */
              fun play(): String? {
                  if (!hasPermission()) return NO_PERMISSION
                  val p = player
                  if (p != null && paused) {
                      try {
                          requestFocus()
                          p.start()
                          paused = false
                          applyVolume()
                          return null
                      } catch (e: Exception) {
                          releasePlayer()
                      }
                  }
                  if (isPlaying()) return null
                  val songs = loadSongs()
                  if (songs.isEmpty()) return NO_SONGS
                  queue = songs.shuffled()
                  index = 0
                  failCount = 0
                  startSong(queue[0])
                  return null
              }

              fun stop(): String? {
                  val p = player
                  if (p == null || !isPlaying()) return NOTHING_PLAYING
                  try {
                      p.pause()
                  } catch (e: Exception) {
                  }
                  paused = true
                  resumeOnGain = false
                  abandonFocus()
                  return null
              }

              fun next(): String? {
                  if (queue.isEmpty() || player == null) return play()
                  index = (index + 1) % queue.size
                  startSong(queue[index])
                  return null
              }

              fun previous(): String? {
                  if (queue.isEmpty() || player == null) return play()
                  index = (index - 1 + queue.size) % queue.size
                  startSong(queue[index])
                  return null
              }

              fun playFavorite(): String? {
                  if (!hasPermission()) return NO_PERMISSION
                  val id = favoriteId()
                  if (id < 0) return "هنوز آهنگ مورد علاقه‌ات رو انتخاب نکردی. از تنظیمات برنامه انتخابش کن."
                  val songs = loadSongs()
                  val fav = songs.firstOrNull { it.id == id }
                      ?: return "آهنگ مورد علاقه‌ات رو توی گوشی پیدا نکردم. دوباره از تنظیمات انتخابش کن."
                  queue = listOf(fav) + songs.filter { it.id != id }.shuffled()
                  index = 0
                  failCount = 0
                  startSong(fav)
                  return null
              }

              /** وقتی بیلی بیداره (داره گوش می‌ده یا حرف می‌زنه) صدای آهنگ کم می‌شه */
              fun setDuck(d: Boolean) {
                  ducked = d
                  applyVolume()
              }

              fun release() {
                  releasePlayer()
                  abandonFocus()
              }

              // ---------- داخلی ----------

              private fun isPlaying(): Boolean = try {
                  player?.isPlaying == true
              } catch (e: Exception) {
                  false
              }

              private fun uriOf(song: Song): Uri =
                  ContentUris.withAppendedId(MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, song.id)

              private fun startSong(song: Song) {
                  releasePlayer()
                  requestFocus()
                  try {
                      val mp = MediaPlayer()
                      mp.setAudioAttributes(attrs)
                      mp.setDataSource(ctx, uriOf(song))
                      mp.setOnPreparedListener { m ->
                          failCount = 0
                          m.start()
                          applyVolume()
                      }
                      mp.setOnCompletionListener { next() }
                      mp.setOnErrorListener { _, _, _ ->
                          onPlayError()
                          true
                      }
                      player = mp
                      paused = false
                      mp.prepareAsync()
                  } catch (e: Exception) {
                      onPlayError()
                  }
              }

              /** اگه یه فایل خراب بود، می‌ره سراغ بعدی؛ ولی اگه چند بار پشت‌سرهم خراب بود، ول می‌کنه */
              private fun onPlayError() {
                  failCount++
                  if (failCount > 5 || queue.size <= 1) {
                      releasePlayer()
                      abandonFocus()
                  } else {
                      next()
                  }
              }

              private fun applyVolume() {
                  val v = if (ducked) 0.2f else 1f
                  try {
                      player?.setVolume(v, v)
                  } catch (e: Exception) {
                  }
              }

              private fun releasePlayer() {
                  val p = player
                  player = null
                  if (p != null) {
                      try {
                          p.setOnCompletionListener(null)
                          p.setOnErrorListener(null)
                          p.setOnPreparedListener(null)
                          p.release()
                      } catch (e: Exception) {
                      }
                  }
              }

              private val focusListener = AudioManager.OnAudioFocusChangeListener { change ->
                  when (change) {
                      AudioManager.AUDIOFOCUS_LOSS -> {
                          // یه برنامه‌ی دیگه (مثلاً ویدیو) صدا رو گرفت
                          if (isPlaying()) {
                              try {
                                  player?.pause()
                              } catch (e: Exception) {
                              }
                              paused = true
                          }
                      }
                      AudioManager.AUDIOFOCUS_LOSS_TRANSIENT -> {
                          if (isPlaying()) {
                              try {
                                  player?.pause()
                              } catch (e: Exception) {
                              }
                              resumeOnGain = true
                          }
                      }
                      AudioManager.AUDIOFOCUS_GAIN -> {
                          if (resumeOnGain) {
                              resumeOnGain = false
                              try {
                                  player?.start()
                              } catch (e: Exception) {
                              }
                          }
                      }
                  }
              }

              private fun requestFocus() {
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          val req = AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                              .setAudioAttributes(attrs)
                              .setOnAudioFocusChangeListener(focusListener)
                              .build()
                          focusRequest = req
                          audioManager.requestAudioFocus(req)
                      } else {
                          @Suppress("DEPRECATION")
                          audioManager.requestAudioFocus(
                              focusListener, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN
                          )
                      }
                  } catch (e: Exception) {
                  }
              }

              private fun abandonFocus() {
                  try {
                      if (Build.VERSION.SDK_INT >= 26) {
                          focusRequest?.let { audioManager.abandonAudioFocusRequest(it) }
                          focusRequest = null
                      } else {
                          @Suppress("DEPRECATION")
                          audioManager.abandonAudioFocus(focusListener)
                      }
                  } catch (e: Exception) {
                  }
              }
          }
