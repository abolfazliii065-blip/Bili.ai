          cat > app/src/main/java/com/example/biliai/BiliController.kt <<'BILI_EOF_7Q'
          package com.example.biliai

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import com.example.biliai.audio.SoundManager
          import com.example.biliai.brain.Action
          import com.example.biliai.brain.Brain
          import com.example.biliai.brain.Reply
          import com.example.biliai.music.MusicPlayer
          import com.example.biliai.voice.VoiceEngine
          import com.example.biliai.voice.VoiceListener

          /** هماهنگ‌کننده‌ی بین گوش (STT)، مغز، چشم‌ها، صدا و دهان (TTS) */
          class BiliController(private val ctx: Context) : VoiceListener {

              var emotion by mutableStateOf(Emotion.NEUTRAL)
                  private set
              var awake by mutableStateOf(false)
                  private set
              var caption by mutableStateOf("")
                  private set
              var status by mutableStateOf("در حال آماده‌سازی…")

              /** وقتی بیلی می‌خوابه (چشم‌ها بسته و منتظر «بیلی») صدا زده می‌شه؛ صفحه ازش برای بستن چهره استفاده می‌کنه */
              var onSleep: (() -> Unit)? = null

              private val main = Handler(Looper.getMainLooper())
              private val brain = Brain(ctx)
              private val sounds = SoundManager()
              private val voice = VoiceEngine(ctx, this)
              val music = MusicPlayer(ctx)

              private var started = false

              fun start() {
                  if (started) return
                  started = true
                  voice.init()
              }

              fun setActive(active: Boolean) = voice.setActive(active)

              fun tapToTalk() {
                  if (!voice.isReady || voice.isBusy) return
                  wakeUp()
                  voice.listenCommand()
              }

              fun release() {
                  main.removeCallbacksAndMessages(null)
                  music.release()
                  voice.release()
                  sounds.release()
              }

              private fun wakeUp() {
                  music.setDuck(true) // صدای آهنگ کم می‌شه تا بیلی بشنوه
                  if (!awake) {
                      awake = true
                      emotion = Emotion.CURIOUS
                      sounds.play(Emotion.CURIOUS)
                  }
                  caption = ""
              }

              private fun goSleep() {
                  music.setDuck(false)
                  awake = false
                  emotion = Emotion.NEUTRAL
                  caption = ""
                  voice.listenWake()
                  onSleep?.invoke()
              }

              // ---------- VoiceListener ----------

              override fun onReady() {
                  status = "بگو «بیلی» یا صفحه رو لمس کن"
              }

              override fun onWake() {
                  // با گفتن «بیلی» چهره‌ی بیلی میاد جلو (حتی اگه صفحه خاموش یا برنامه‌ی دیگه‌ای بازه)
                  WakeUi.show(ctx)
                  wakeUp()
              }

              /** کارهای جانبی جواب (مثل پخش آهنگ) رو انجام می‌ده. اگه مشکلی بود، متن خطا برمی‌گرده */
              private fun runAction(r: Reply): String {
                  val err: String? = when (r.action) {
                      Action.NONE -> null
                      Action.MUSIC_PLAY -> music.play()
                      Action.MUSIC_STOP -> music.stop()
                      Action.MUSIC_NEXT -> music.next()
                      Action.MUSIC_PREV -> music.previous()
                      Action.MUSIC_FAVORITE -> music.playFavorite()
                  }
                  return err ?: r.text
              }

              override fun onHeard(text: String) {
                  val reply: Reply = brain.respond(text)
                  val spoken = runAction(reply)
                  val failed = spoken != reply.text
                  val emo = if (failed) Emotion.SAD else reply.emotion
                  emotion = emo
                  val delayMs = sounds.play(emo)
                  main.postDelayed({
                      caption = spoken
                      voice.speak(spoken) {
                          if (reply.sleep && !failed) goSleep() else voice.listenCommand(6000)
                      }
                  }, delayMs + 80)
              }

              override fun onListeningTimeout() = goSleep()

              override fun onTtsMissing() {
                  status = "صدای فارسی نصب نیست؛ موتور صدای فارسی رو نصب کن و اپ رو دوباره باز کن"
              }

              override fun onError(message: String) {
                  status = message
              }
          }
