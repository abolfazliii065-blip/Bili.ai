              private fun canon(s: String): String {
                  val toks = s.split(" ").filter { it.isNotEmpty() }
                  val out = mutableListOf<String>()
                  var i = 0
                  while (i < toks.size) {
                      if ((toks[i] == "می" || toks[i] == "نمی") && i + 1 < toks.size) {
