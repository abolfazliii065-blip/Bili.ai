          cat > app/src/main/java/com/example/biliai/WakeUi.kt <<'BILI_EOF_7Q'
          package com.example.biliai

          import android.app.KeyguardManager
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat

          /**
           * وقتی کاربر می‌گه «بیلی»، صفحه‌ی بیلی رو میاره جلو.
           * دو راه همزمان امتحان می‌شه چون اندروید شروع صفحه از پس‌زمینه رو محدود کرده:
           *  1) شروع مستقیم صفحه (اگه اجازه‌ی «نمایش روی برنامه‌های دیگه» داده شده باشه کار می‌کنه)
           *  2) اعلان تمام‌صفحه (وقتی صفحه خاموش یا قفله، خودش صفحه رو باز می‌کنه؛ وگرنه فقط یه اعلان بالای صفحه می‌ده)
           */
          object WakeUi {
              const val EXTRA_FROM_WAKE = "from_wake"
              private const val CHANNEL_ID = "bili_wake"
              private const val NOTIF_ID = 2

              private fun launchIntent(ctx: Context): Intent =
                  Intent(ctx, MainActivity::class.java).apply {
                      addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK or
                              Intent.FLAG_ACTIVITY_SINGLE_TOP or
                              Intent.FLAG_ACTIVITY_REORDER_TO_FRONT
                      )
                      putExtra(EXTRA_FROM_WAKE, true)
                  }

              private val main = Handler(Looper.getMainLooper())

              fun show(ctx: Context) {
                  val intent = launchIntent(ctx)
                  val canOverlay = try {
                      Settings.canDrawOverlays(ctx)
                  } catch (e: Exception) {
                      false
                  }
                  // اعلان فقط وقتی لازمه که صفحه خاموش/قفله، یا اجازه‌ی «نمایش روی برنامه‌های دیگه» رو نداریم
                  if (!BiliHub.uiVisible && (!canOverlay || isScreenOffOrLocked(ctx))) {
                      postFullScreenNotification(ctx, intent)
                  }
                  if (canOverlay) {
                      startWithOverlay(ctx, intent)
                  } else {
                      try {
                          ctx.startActivity(intent)
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun isScreenOffOrLocked(ctx: Context): Boolean {
                  return try {
                      val pm = ctx.getSystemService(Context.POWER_SERVICE) as PowerManager
                      val km = ctx.getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                      val screenOff = !pm.isInteractive
                      val locked = km.isKeyguardLocked
                      screenOff || locked
                  } catch (e: Exception) {
                      false
                  }
              }

              /**
               * اندروید جدید شروع صفحه از پس‌زمینه رو فقط وقتی اجازه می‌ده که برنامه یه پنجره‌ی روی-بقیه (overlay) قابل‌دیدن داشته باشه.
               * پس یه پنجره‌ی یک‌پیکسلی و تقریباً نامرئی می‌سازیم، صفحه رو باز می‌کنیم و بعد از چند ثانیه پنجره رو برمی‌داریم.
               */
              private fun startWithOverlay(ctx: Context, intent: Intent) {
                  main.post {
                      var added: View? = null
                      val wm = ctx.getSystemService(Context.WINDOW_SERVICE) as WindowManager
                      try {
                          val v = View(ctx)
                          v.setBackgroundColor(Color.argb(1, 0, 0, 0))
                          val type = if (Build.VERSION.SDK_INT >= 26) {
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          } else {
                              WindowManager.LayoutParams.TYPE_PHONE
                          }
                          val lp = WindowManager.LayoutParams(
                              1, 1, type,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                                  WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                                  WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT
                          )
                          lp.gravity = Gravity.TOP or Gravity.START
                          wm.addView(v, lp)
                          added = v
                      } catch (e: Exception) {
                      }
                      val overlayView = added
                      main.postDelayed({
                          try {
                              ctx.startActivity(intent)
                          } catch (e: Exception) {
                          }
                      }, 150L)
                      if (overlayView != null) {
                          main.postDelayed({
                              try {
                                  wm.removeView(overlayView)
                              } catch (e: Exception) {
                              }
                          }, 3000L)
                      }
                  }
              }

              fun cancel(ctx: Context) {
                  try {
                      val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.cancel(NOTIF_ID)
                  } catch (e: Exception) {
                  }
              }

              private fun postFullScreenNotification(ctx: Context, intent: Intent) {
                  try {
                      val nm = ctx.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      if (Build.VERSION.SDK_INT >= 26) {
                          val ch = NotificationChannel(CHANNEL_ID, "بیدار شدن بیلی", NotificationManager.IMPORTANCE_HIGH)
                          ch.setSound(null, null)
                          ch.enableVibration(false)
                          nm.createNotificationChannel(ch)
                      }
                      val pi = PendingIntent.getActivity(
                          ctx, 10, intent, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      val n = NotificationCompat.Builder(ctx, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .setContentTitle("بیلی")
                          .setContentText("بیلی بیدار شد؛ لمس کن تا چهره‌اش رو ببینی")
                          .setPriority(NotificationCompat.PRIORITY_HIGH)
                          .setCategory(NotificationCompat.CATEGORY_CALL)
                          .setContentIntent(pi)
                          .setFullScreenIntent(pi, true)
                          .setAutoCancel(true)
                          .setTimeoutAfter(15000)
                          .build()
                      nm.notify(NOTIF_ID, n)
                  } catch (e: Exception) {
                  }
              }
          }
