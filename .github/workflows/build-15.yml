          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper

          /** حافظه‌ی محلی بیلی (SQLite روی خود گوشی، بدون اینترنت) */
          class Memory(ctx: Context) : SQLiteOpenHelper(ctx, "bili.db", null, 1) {

              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE facts(k TEXT PRIMARY KEY, v TEXT NOT NULL)")
                  db.execSQL("CREATE TABLE notes(id INTEGER PRIMARY KEY AUTOINCREMENT, text TEXT NOT NULL, ts INTEGER NOT NULL)")
              }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {}

              fun get(key: String): String? =
                  readableDatabase.rawQuery("SELECT v FROM facts WHERE k=?", arrayOf(key)).use {
                      if (it.moveToFirst()) it.getString(0) else null
                  }

              fun set(key: String, value: String) {
                  writableDatabase.execSQL("INSERT OR REPLACE INTO facts(k,v) VALUES(?,?)", arrayOf(key, value))
              }

              fun addNote(text: String) {
                  writableDatabase.execSQL(
                      "INSERT INTO notes(text,ts) VALUES(?,?)",
                      arrayOf<Any>(text, System.currentTimeMillis())
                  )
              }

              fun lastNotes(n: Int): List<String> =
                  readableDatabase.rawQuery("SELECT text FROM notes ORDER BY id DESC LIMIT $n", null).use {
                      val list = mutableListOf<String>()
                      while (it.moveToNext()) list.add(it.getString(0))
                      list
                  }
          }
