                                  text = "آهنگی توی گوشی پیدا نشد. فایل آهنگ (مثلاً mp3) توی گوشی بذار و دوباره بیا اینجا.",
                                  color = Muted,
                                  fontSize = 15.sp
                              )
                          }
                      } else {
                          item {
                              Column(Modifier.fillMaxWidth()) {
                              BasicTextField(
                                  value = query,
                                  onValueChange = { query = it },
                                  singleLine = true,
                                  textStyle = TextStyle(color = Color.White, fontSize = 17.sp),
                                  cursorBrush = SolidColor(Color.White),
                                  modifier = Modifier
                                      .fillMaxWidth()
                                      .background(Chip, RoundedCornerShape(10.dp))
                                      .padding(12.dp),
                                  decorationBox = { inner ->
                                      Box {
                                          if (query.isEmpty()) {
                                              Text(text = "جستجوی آهنگ…", color = Muted, fontSize = 17.sp)
                                          }
                                          inner()
                                      }
                                  }
                              )
                              Spacer(Modifier.height(10.dp))
                              }
                          }
                          items(shown, key = { it.id }) { song ->
                              val selected = song.id == favId
                              Column(
                                  Modifier
                                      .fillMaxWidth()
                                      .padding(vertical = 3.dp)
                                      .background(
                                          if (selected) Color(0xFF12323A) else Chip,
                                          RoundedCornerShape(10.dp)
                                      )
                                      .clickable {
                                          music.setFavorite(song)
                                          favId = song.id
                                          favTitle = song.title
                                      }
                                      .padding(horizontal = 14.dp, vertical = 10.dp)
                              ) {
                                  Text(
                                      text = (if (selected) "★ " else "") + song.title,
                                      color = if (selected) Cyan else Color.White,
                                      fontSize = 17.sp
                                  )
                                  if (song.artist.isNotEmpty()) {
                                      Text(text = song.artist, color = Muted, fontSize = 13.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }
