          package com.example.biliai

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat

          /**
           * سرویس پیش‌زمینه: بیلی حتی وقتی صفحه خاموش یا اپ بسته (از لیست اخیر پاک نشده) هست گوش می‌ده.
           * همه‌چیز آفلاینه؛ فقط میکروفون استفاده می‌شه.
           */
          class BiliService : Service() {

              private var wakeLock: PowerManager.WakeLock? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
                  val notification = buildNotification()
                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(NOTIF_ID, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(NOTIF_ID, notification)
                  }
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "bili:listening").apply {
                      setReferenceCounted(false)
                      acquire()
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == ACTION_STOP) {
                      stopForeground(STOP_FOREGROUND_REMOVE)
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val controller = BiliHub.controller
                      ?: BiliController(applicationContext).also { BiliHub.controller = it }
                  controller.start()
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  BiliHub.controller?.release()
                  BiliHub.controller = null
                  wakeLock?.let { if (it.isHeld) it.release() }
                  super.onDestroy()
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(
                          NotificationChannel(CHANNEL_ID, "بیلی", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
              }

              private fun buildNotification(): Notification {
                  val open = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  val stop = PendingIntent.getService(
                      this, 1, Intent(this, BiliService::class.java).setAction(ACTION_STOP),
