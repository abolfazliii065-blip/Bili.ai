              fun respond(raw: String): Reply {
                  val t = canon(PersianText.normalize(raw))
                  val tokens = t.split(" ").filter { it.isNotEmpty() }
                  val owner = owner()

                  if (tokens.isEmpty()) return Reply("", Emotion.NEUTRAL)

                  // یاد دادن اسم
                  Regex("^(?:اسم من|اسمم) (.+?)(?: هست| است| ه)?$").find(t)?.let {
                      val name = it.groupValues[1].trim()
                      if (name.isNotEmpty() && !name.contains("چی")) {
                          memory.set("owner_name", name)
                          val text = "خوشحال شدم $name! از این به بعد اسمت رو یادمه."
                          lastText = text
                          return Reply(text, Emotion.EXCITED)
                      }
                  }

                  // یادداشت کردن
                  Regex("^(?:یادت باشه|یادت باشد|یاد بگیر|یادداشت کن) (.+)$").find(t)?.let {
                      memory.addNote(it.groupValues[1])
                      val text = pick("note", listOf("باشه، یادم می‌مونه.", "حتماً! یادداشت کردم."))
                      lastText = text
                      return Reply(text, Emotion.HAPPY)
                  }

                  // انتخاب بهترین قصد: هرچی عبارت بلندتری جور باشه امتیازش بیشتره
                  var best: Intent? = null
                  var bestScore = 0
                  for (intent in intents(owner)) {
                      if (tokens.size > intent.maxWords) continue
                      var len = 0
                      for (p in intent.phrases) {
                          val l = matchLen(tokens, p)
                          if (l > len) len = l
                      }
                      if (len == 0) continue
                      val score = len * 10 + (if (len == tokens.size) 5 else 0)
                      if (score > bestScore) {
                          bestScore = score
                          best = intent
                      }
                  }

                  val chosen = best
                  if (chosen != null) {
                      val text = chosen.answer()
                      if (chosen.key != "repeat") lastText = text
                      return Reply(text, chosen.emotion, chosen.sleep, chosen.action)
                  }

                  val text = pick(
                      "unknown",
                      listOf(
                          "ببخشید، متوجه نشدم. می‌شه دوباره بگی؟",
                          "هوم؟ این رو هنوز بلد نیستم. بگو «چیکار می‌تونی بکنی» تا ببینی چی بلدم.",
                          "این یکی رو نفهمیدم. یه جور دیگه بگو؟"
                      )
                  )
                  lastText = text
                  return Reply(text, Emotion.CURIOUS)
              }

              /** تبدیل تاریخ میلادی به شمسی (بدون هیچ کتابخانه‌ی خارجی) */
              private fun gregorianToJalali(gy: Int, gm: Int, gd: Int): Triple<Int, Int, Int> {
                  val gdm = intArrayOf(0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334)
                  val gy2 = if (gm > 2) gy + 1 else gy
                  var days = 355666 + (365 * gy) + ((gy2 + 3) / 4) - ((gy2 + 99) / 100) + ((gy2 + 399) / 400) + gd + gdm[gm - 1]
                  var jy = -1595 + (33 * (days / 12053))
                  days %= 12053
                  jy += 4 * (days / 1461)
                  days %= 1461
                  if (days > 365) {
                      jy += (days - 1) / 365
                      days = (days - 1) % 365
                  }
                  val jm = if (days < 186) 1 + days / 31 else 7 + (days - 186) / 30
                  val jd = 1 + if (days < 186) days % 31 else (days - 186) % 30
                  return Triple(jy, jm, jd)
              }
          }
